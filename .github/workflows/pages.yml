name: Pages

# Publishes main to Cloudflare Pages, which serves it at maze.micras.team. The build runs read only
# and with no secret, in Playwright's image of the pinned version, which has Chromium for the
# tests; publish, which holds the Cloudflare token, only uploads its files.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - run: git config --global --add safe.directory '*'

      - run: npm install --global bun@1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: cloudflare
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site

      - run: >-
          npx --yes wrangler@4.155.0 pages deploy "$RUNNER_TEMP/site" --project-name=maze-studio
          --branch=main --commit-hash="$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34ebfad1eba77b88252b1f496592d5d2
