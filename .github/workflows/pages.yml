name: Pages

# GitHub Pages serves the gh-pages branch: the site at its root, and the preview of each open pull
# request at pr-<n>/, which the preview workflows write. This one publishes main at the root and
# keeps the previews. The build runs read only; publish, which can write, only copies its files.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read
    steps:
      - name: Check that Pages serves the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type + " " + .source.branch')"
          if [ "$source" != 'legacy gh-pages' ]; then
            echo "Pages serves '$source'; set it to deploy from the gh-pages branch, see the README" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site

      - run: .github/scripts/gh-pages.sh site "$RUNNER_TEMP/site"
