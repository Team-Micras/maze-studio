name: Pages

# GitHub Pages serves the gh-pages branch: the site at its root, and the preview of each open pull
# request at pr-<n>/, which the preview workflows write. This one publishes main at the root and
# keeps the previews.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      - run: bun run lint

      - run: bun run typecheck

      - run: bun run test

      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - run: .github/scripts/gh-pages.sh site dist
