name: Sync develop

# Brings what lands on main without passing through develop, such as Dependabot's weekly bump of
# vendor/mazefiles, back into develop: when main changes files develop lacks, it opens a pull request
# from main to develop, or reuses the open one, and turns on its auto-merge. A release from develop
# changes no file develop lacks, so nothing happens then. The pull request's head is main's own
# commit, so the check CI ran on that commit is the one develop requires. Merging it never deletes
# main: GitHub keeps the default branch, and main's protection refuses deletion.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed="$(gh api "repos/$GITHUB_REPOSITORY/compare/develop...main" --jq '.files | length')"
          if [ "$changed" = 0 ]; then
            echo "develop has every change of main"
            exit 0
          fi
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open \
            --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main \
              --title "🔀 Bring main back into develop" \
              --body "main changed files develop lacks, such as the weekly mazefiles bump. This merges them back."
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base develop --head main --state open \
              --json number --jq '.[0].number')"
          fi
          gh pr merge --repo "$GITHUB_REPOSITORY" --auto --merge "$number"
