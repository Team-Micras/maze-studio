name: Preview deploy

# Publishes what Preview build made to Cloudflare Pages, at pr-<n>.maze-studio-8ol.pages.dev, an
# origin of its own, and comments the link on the pull request. It runs as this file is on the
# default branch, with the Cloudflare token, so it never checks out nor runs anything of the pull
# request: it uploads the built files, after checking that the build came from a branch of this
# repository and that the number the artifact gives is an open pull request whose head is the
# commit that was built.
on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]

permissions: {}

concurrency:
  group: preview-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: cloudflare
    permissions:
      pull-requests: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview
          path: ${{ runner.temp }}/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - id: pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW: ${{ runner.temp }}/preview
        run: |
          number="$(head -c 16 "$PREVIEW/number" | tr -d '[:space:]')"
          [[ "$number" =~ ^[1-9][0-9]*$ ]] || { echo "not a pull request number: $number" >&2; exit 1; }
          pull="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.state + " " + .head.sha')"
          [ "$pull" = "open $HEAD_SHA" ] || { echo "pull request #$number is not open at $HEAD_SHA" >&2; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # _worker.js and _routes.json would make Cloudflare run the pull request's code as a server.
      - name: Refuse links, .git, server code and anything over 50 MB
        env:
          SITE: ${{ runner.temp }}/preview/site
        run: |
          if find "$SITE" -type l -o -name .git -o -name _worker.js -o -name _routes.json | grep -q .; then
            echo "refusing the preview: it holds links, .git, _worker.js or _routes.json" >&2
            exit 1
          fi
          if [ "$(du -sb "$SITE" | cut -f1)" -gt $((50 * 1024 * 1024)) ]; then
            echo "refusing the preview: it is over 50 MB" >&2
            exit 1
          fi

      - run: >-
          npx --yes wrangler@4.155.0 pages deploy "$RUNNER_TEMP/preview/site"
          --project-name=maze-studio --branch="pr-$NUMBER" --commit-hash="$HEAD_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 34ebfad1eba77b88252b1f496592d5d2
          NUMBER: ${{ steps.pull.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ steps.pull.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker='<!-- maze-studio-preview -->'
          url="https://pr-$NUMBER.maze-studio-8ol.pages.dev/"
          body="$marker
          Preview of ${HEAD_SHA:0:7}: $url"
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" -f body="$body"
          fi
