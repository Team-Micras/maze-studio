name: Auto-merge mazefiles updates

# Dependabot's weekly bump of vendor/mazefiles merges itself once CI passes. The workflow runs on
# pull_request_target, so what runs with write access is this file as it is on main, never a copy
# from the pull request; and it checks out nothing from the pull request: it reads Dependabot's
# metadata and the changed files through the API, waits for the checks main requires, and merges.
# Dependabot opens the same bump against main and against develop. A merge made with GITHUB_TOKEN
# starts no workflow, so once the bump lands on main this starts Pages itself; workflow_dispatch is
# the one event that token may start.
on: pull_request_target

permissions: {}

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      actions: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the pull request only moves the submodule
        if: steps.metadata.outputs.package-ecosystem == 'gitsubmodule'
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files="$(gh pr diff "$PR_URL" --name-only)"
          echo "changed: $files"
          if [ "$files" = "vendor/mazefiles" ]; then
            echo "only-submodule=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the checks main requires, failing when it requires none
        if: steps.scope.outputs.only-submodule == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 300); do
            set +e
            gh pr checks "$PR_URL" --required > /dev/null 2>&1
            status=$?
            set -e
            if [ "$status" -eq 0 ] || [ "$status" -eq 8 ]; then
              break
            fi
            sleep 10
          done
          gh pr checks "$PR_URL" --required --watch --fail-fast

      - name: Merge
        if: steps.scope.outputs.only-submodule == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Publish main, which the merge does not start
        if: steps.scope.outputs.only-submodule == 'true' && github.event.pull_request.base.ref == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 60); do
            if [ "$(gh pr view "$PR_URL" --json state --jq .state)" = MERGED ]; then
              gh workflow run pages.yml --ref main
              exit 0
            fi
            sleep 30
          done
          echo "the pull request did not merge within 30 minutes" >&2
          exit 1
