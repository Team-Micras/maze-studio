name: Preview cleanup

# Removes a pull request's preview from gh-pages once it closes. It runs as this file is on the
# default branch and checks out nothing of the pull request; the number comes from the event.
on:
  pull_request_target:
    types: [closed]

permissions: {}

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - run: .github/scripts/gh-pages.sh drop "$NUMBER"
        env:
          NUMBER: ${{ github.event.number }}
