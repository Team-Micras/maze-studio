name: Preview build

# Builds a pull request for its preview, as any pull request runs, from a fork too: read only, with
# no secret. Preview deploy, which runs trusted, publishes what this uploads.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/pr-${{ github.event.number }}/

      - run: |
          mkdir preview
          mv dist preview/site
          echo '${{ github.event.number }}' > preview/number

      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview
          retention-days: 7
