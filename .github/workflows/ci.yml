name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  part:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - part: static
            run: bun run lint && bun run format:check && bun run typecheck && bun run build && bun run size
          - part: unit
            run: bun run test:unit
          - part: browser
            run: bun run test:browser
          - part: e2e 1/2
            run: bun run test:e2e --shard=1/2
          - part: e2e 2/2
            run: bun run test:e2e --shard=2/2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - run: ${{ matrix.run }}

  check:
    if: always()
    needs: part
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.part.result }}" = success
