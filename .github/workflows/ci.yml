name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The parts that need no browser run on the runner and install none.
  part:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - part: static
            run: bun run lint && bun run format:check && bun run typecheck && bun run build && bun run size
          - part: unit
            run: bun run test:unit
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: ${{ matrix.run }}

  # The parts that drive Chromium run in Playwright's image of the pinned version, which has the
  # browser and its system libraries, and is the image the reference screenshots are made in.
  browser:
    name: ${{ matrix.part }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0
      options: --ipc=host
    env:
      HOME: /root
    strategy:
      matrix:
        include:
          - part: browser
            run: bun run test:browser
          - part: e2e 1/2
            run: bun run test:e2e --shard=1/2
          - part: e2e 2/2
            run: bun run test:e2e --shard=2/2
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - run: git config --global --add safe.directory '*'

      - run: npm install --global bun@1.4.2

      - run: bun install --frozen-lockfile

      - run: ${{ matrix.run }}

  check:
    if: always()
    needs: [part, browser]
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.part.result }}" = success && test "${{ needs.browser.result }}" = success
