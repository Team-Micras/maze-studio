<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/maze-studio.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Browse, view and edit micromouse mazes in the mazefiles format"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#e3e3e3" />
    <script>
      {
        const forced = new URLSearchParams(location.search).get('theme');
        const dark =
          forced === 'dark' ||
          (forced !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#191919' : '#e3e3e3');
      }
    </script>
    <title>Maze Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
